services:
  - type: web
    name: bluegate-insta-downloader-v2
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: MAX_SEND_MB
        value: "49"
      - key: BRAND_NAME
        value: "BlueGate Downloader"
      - key: SUPPORT_USERNAME
        value: "BlueGateSupport"
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: "/tmp/instabot.db"
      - key: JOB_TTL_HOURS
        value: "12"
