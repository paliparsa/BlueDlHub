services:
  - type: web
    name: bluegate-multi-downloader-v4
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: FASTSAVER_API_KEY
        sync: false
      - key: FASTSAVER_BASE_URL
        value: "https://api.fastsaver.io/v1"
      - key: FASTSAVER_TIMEOUT
        value: "300"
      - key: MAX_SEND_MB
        value: "49"
      - key: MAX_PLAYLIST_ITEMS
        value: "10"
      - key: BRAND_NAME
        value: "BlueGate Downloader"
      - key: SUPPORT_USERNAME
        value: "BlueGateSupport"
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: "/tmp/bluegate_downloader.db"
      - key: JOB_TTL_HOURS
        value: "12"
      - key: SPOTIFY_ENABLED
        value: "true"
