services:
  - type: web
    name: bluegate-downloader
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FASTSAVER_API_KEY
        sync: false
      - key: FASTSAVER_BASE_URL
        value: "https://api.fastsaver.io/v1"
      - key: FASTSAVER_TIMEOUT
        value: "300"
      - key: MAX_SEND_MB
        value: "49"
      - key: MAX_PLAYLIST_ITEMS
        value: "10"
      - key: BRAND_NAME
        value: "BlueGate Downloader"
      - key: SUPPORT_USERNAME
        value: "BlueGateSupport"
      - key: DB_PATH
        value: "/tmp/bluegate_downloader.db"
      - key: JOB_TTL_HOURS
        value: "12"
      - key: SPOTIFY_ENABLED
        value: "true"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: MAX_QUEUE_SIZE
        value: "100"
      - key: MAX_ACTIVE_JOBS_PER_USER
        value: "3"
      - key: USER_JOB_COOLDOWN
        value: "3"
      - key: QUEUE_MAX_RETRIES
        value: "2"
      - key: SMART_CACHE_TTL_DAYS
        value: "90"
      - key: FASTSAVER_HEALTH_INTERVAL
        value: "600"
      - key: BATCH_MAX_LINKS
        value: "25"
